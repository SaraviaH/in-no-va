      <rect width="24" height="24" fill="#F6F4EE"/>
      <path d="M2 20 C6 6, 12 6, 12 20 C12 6, 18 6, 22 20" fill="none" stroke="#E5DFD3" stroke-width="1.4" stroke-linecap="round"/>
      <path d="M2 8 C6 -6, 12 -6, 12 8 C12 -6, 18 -6, 22 8" fill="none" stroke="#EAE4D8" stroke-width="1.2" stroke-linecap="round"/>
    </pattern>
    <linearGradient id="drape-p01" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.65"/>
      <stop offset="45%" stop-color="#F3EFE6" stop-opacity="0.1"/>
      <stop offset="75%" stop-color="#E2DACB" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FAF8F4" stop-opacity="0.5"/>
    </linearGradient>
  </defs>
  <rect width="800" height="1000" fill="url(#jersey-pima)"/>
